<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="20" y1="15" x2="47" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- App-matching dark rounded-square base -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="15.25"
        stroke="#334155" stroke-width="1.5"/>

  <!-- Stylized wallet / balance shape -->
  <g filter="url(#shadow)">
    <path d="M15 21.5A5.5 5.5 0 0 1 20.5 16h23A5.5 5.5 0 0 1 49 21.5v20A5.5 5.5 0 0 1 43.5 47h-23A5.5 5.5 0 0 1 15 41.5v-20Z"
          fill="#F8FAFC"/>
    <path d="M15 23h34v7H39.5A4.5 4.5 0 0 0 35 34.5v0a4.5 4.5 0 0 0 4.5 4.5H49"
          fill="#E2E8F0"/>
    <path d="M15 23h34v7H39.5A4.5 4.5 0 0 0 35 34.5v0a4.5 4.5 0 0 0 4.5 4.5H49"
          stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M42 33h7v7h-7a3.5 3.5 0 1 1 0-7Z" fill="url(#accent)"/>
    <circle cx="42.5" cy="36.5" r="1.3" fill="#fff"/>
  </g>

  <!-- ₹ mark, simplified for crisp favicon rendering -->
  <path d="M23 19.5h10.5M23 23h8.5M29 19.5c2.9 0 4.7 1.35 4.7 3.45S31.9 26.5 29 26.5H25.5L33.5 33"
        stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Income/expense accent dots -->
  <circle cx="20" cy="43" r="2.2" fill="#22C55E"/>
  <circle cx="27" cy="43" r="2.2" fill="#EF4444"/>
</svg>
